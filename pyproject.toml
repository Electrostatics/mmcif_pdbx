[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmcif-pdbx"
dynamic = ["version"]
description = "Python utilities for PDBx/mmCIF storage model"
readme = "README.md"
requires-python = ">=3.10"
license = "CC0-1.0"
authors = [{ name = "John Westbrook", email = "jwest@rcsb.rutgers.edu" }]
maintainers = [
    { name = "Nathan Baker", email = "nathanandrewbaker@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/Electrostatics/mmcif_pdbx"
Documentation = "https://mmcif-pdbx.readthedocs.io"
Issues = "https://github.com/Electrostatics/mmcif_pdbx/issues"

[project.optional-dependencies]
test = ["pytest>9.0.2", "coverage", "flake8", "black"]
docs = ["sphinx", "sphinx_rtd_theme>=1.0"]

[tool.setuptools.packages.find]
include = ["pdbx*"]

[tool.setuptools.dynamic]
version = { attr = "pdbx._version.__version__" }

[tool.black]
line-length = 78

[tool.coverage.run]
source = ["pdbx"]
omit = ["tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
